# Operational cooling only; not a model, data, seed or acceptance-threshold change.
[gpu]
pause_at_celsius = 80
resume_at_or_below_celsius = 76
poll_seconds = 5.0
fallback_delay_seconds = 5.0
maximum_cooling_sleep_seconds = 60.0

# Exact original metrics reproduced on two real Cho folds; inconclusive -> original MNE.
[csp]
certify_full_numerical_rank = true
