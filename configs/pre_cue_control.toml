[gate_a]
gate_name = "pre_cue_control"
attempt = "one_second_pre_cue_control"
protocol = "within-subject cross-session pre-cue EEGNet negative control"
source = "artifact"
artifact_pattern = "data/processed/bci_iv_2a/pre_cue_control/subject_{subject:02d}.npz"
subjects = [1, 2, 3, 4, 5, 6, 7, 8, 9]
seeds = [11, 23, 37, 53]
included_labels = ["left_hand", "right_hand", "feet", "tongue"]
sampling_rate_hz = 128.0
confidence_level = 0.95
reference_name = "four-class chance control"
reference_status = "internal_negative_control"
reference_score = 0.25
control_max_accuracy = 0.35

[gate_a.training]
epochs = 50
batch_size = 32
learning_rate = 0.001
weight_decay = 0.0
validation_fraction = 0.2
early_stopping_patience = 10
input_scale = 1000000.0

[output]
runs_root = "runs/pre_cue_control"
checkpoints_root = "checkpoints/eegnet/pre_cue_control"
summary = "runs/pre_cue_control/summary.json"
