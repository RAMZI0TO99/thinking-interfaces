[lora]
ranks = [4, 8, 16]
alpha_multiplier = 2.0
dropout = 0.0

[adapter]
bottleneck_dimensions = [16, 32, 64]
dropout = 0.0

[prompt]
tokens = 4
hidden_dimension = 256
injection_modes = ["temporal_prefix", "per_block_prefix"]

[partial_finetuning]
last_blocks = [0, 4, 8, 12]
include_all = true

[episode]
support_selection = "earliest_balanced"
shots_per_class = 5
query_selection = "all_remaining"

[standin_smoke]
seed = 20260830
embedding_dimension = 32
classes = 2
batch_size = 8
shots = 5
steps = 3
learning_rate = 0.05
