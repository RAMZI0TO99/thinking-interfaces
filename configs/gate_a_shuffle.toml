[gate_a]
attempt = "shuffled_label_negative_control"
source = "moabb_reference"
subjects = [1, 2, 3, 4, 5, 6, 7, 8, 9]
seeds = [11]
included_labels = ["left_hand", "right_hand"]
events = ["right_hand", "left_hand"]
bandpass_low_hz = 4.0
bandpass_high_hz = 100.0
sampling_rate_hz = 250.0
reference = "dataset_original"
baseline = "none"
shuffle_development_labels = true
negative_control_max_accuracy = 0.60
reference_name = "chance performance under shuffled development labels"
reference_status = "precommitted_negative_control"
confidence_level = 0.95

[gate_a.training]
epochs = 100
batch_size = 64
learning_rate = 0.000625
weight_decay = 0.0
validation_fraction = 0.2
early_stopping_patience = 25
input_scale = 1.0

[output]
runs_root = "runs/gate_a/shuffled_label_negative_control"
checkpoints_root = "checkpoints/eegnet/gate_a/shuffled_label_negative_control"
summary = "runs/gate_a/gate_a_shuffled_label_summary.json"
