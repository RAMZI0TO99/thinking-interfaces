report_class_balance = true

[preprocessing.profile_a]
bandpass_low_hz = 8.0
bandpass_high_hz = 30.0
resample_hz = 128.0
reference = "common_average"
epoch_duration_s = 4.0
pre_cue_s = 1.0

[preprocessing.profile_b]
bandpass_low_hz = 0.1
bandpass_high_hz = 75.0
notch_hz = 50.0
resample_hz = 200.0
reference = "original"
