[project]
name = "thinking-interfaces"
phase = 1
seed = 20260830

[storage]
data_root = "data"
runs_root = "runs"
checkpoints_root = "checkpoints"
minimum_free_gb = 20

[hardware]
minimum_gpu_vram_mib = 8192

[evaluation]
fold_strategy = "leave-one-subject-out"
